[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bosshelper"
version = "0.1.0"
description = "BOSS直聘智能求职助手 · AI驱动的自动化求职工具"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "bosshelper" }]
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "playwright>=1.40",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "pyyaml>=6.0",
    "httpx>=0.24",
    "mcp>=1.8.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-ollama>=0.3.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[project.scripts]
bosshelper = "bosshelper_cli.cli:main"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["bosshelper_cli", "backend"]
