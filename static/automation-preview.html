<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>交给AI - 设计稿预览</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      animation: { 'slide-in': 'slideIn 0.3s ease', 'pulse-glow': 'pulseGlow 2s infinite' },
      keyframes: {
        slideIn: { from: { transform: 'translateY(10px)', opacity: '0' }, to: { transform: 'translateY(0)', opacity: '1' } },
        pulseGlow: { '0%,100%': { boxShadow: '0 0 8px rgba(99,102,241,0.3)' }, '50%': { boxShadow: '0 0 20px rgba(99,102,241,0.6)' } }
      }
    }
  }
}
</script>
</head>
<body class="bg-slate-50 p-8 font-sans">

<div class="max-w-4xl mx-auto space-y-5 animate-slide-in">

  <!-- ═══ 顶部 Hero 区 ═══ -->
  <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
    <div class="flex items-start justify-between mb-5">
      <div>
        <h2 class="text-xl font-bold text-slate-800">AI 自动求职</h2>
        <p class="text-xs text-slate-400 mt-1.5">配置后可自动搜索岗位、投递简历、AI回复消息</p>
      </div>
      <button class="flex items-center gap-2.5 px-10 py-4 rounded-2xl text-base font-bold transition-all cursor-pointer shadow-lg bg-gradient-to-r from-emerald-500 to-teal-500 text-white hover:shadow-emerald-200 hover:-translate-y-0.5">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        启动
      </button>
    </div>

    <!-- 大进度条 -->
    <div class="mb-3">
      <div class="flex items-center justify-between text-xs mb-2">
        <span class="text-slate-500 font-medium">今日投递进度</span>
        <span class="font-bold text-slate-700 text-sm">18 / 30</span>
      </div>
      <div class="h-4 bg-slate-100 rounded-full overflow-hidden">
        <div class="h-full rounded-full bg-gradient-to-r from-indigo-500 to-purple-500 transition-all duration-700" style="width:60%"></div>
      </div>
    </div>

    <!-- 状态行 -->
    <div class="flex items-center justify-between text-sm">
      <div class="flex items-center gap-3">
        <span class="flex items-center gap-1.5 font-medium text-emerald-500">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          投递中
        </span>
        <span class="text-slate-300">|</span>
        <span class="text-xs text-slate-400">最后执行: 14:25</span>
      </div>
      <span class="text-xs text-slate-400">下次执行: 14:55</span>
    </div>
  </div>

  <!-- ═══ 两栏设置区 ═══ -->
  <div class="grid grid-cols-2 gap-5">

    <!-- 左侧: 搜索设置 -->
    <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
      <h3 class="text-sm font-bold text-slate-800 mb-4 flex items-center gap-2">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        搜索设置
      </h3>
      <div class="space-y-3.5">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1.5">关键词</label>
          <input type="text" value="AI Agent" class="w-full px-3 py-2.5 rounded-lg border border-slate-200 bg-slate-50 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1.5">城市</label>
            <select class="w-full px-3 py-2.5 rounded-lg border border-slate-200 bg-slate-50 text-sm outline-none focus:border-indigo-500 cursor-pointer">
              <option>淄博</option>
              <option>北京</option>
              <option>上海</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1.5">每日上限</label>
            <div class="flex items-center gap-2">
              <input type="number" value="30" class="w-20 px-3 py-2.5 rounded-lg border border-slate-200 bg-slate-50 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all" />
              <span class="text-xs text-slate-400">条/天</span>
            </div>
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1.5">HR 活跃度</label>
          <select class="w-full px-3 py-2.5 rounded-lg border border-slate-200 bg-slate-50 text-sm outline-none focus:border-indigo-500 cursor-pointer">
            <option>全部（活跃优先）</option>
            <option>本周内活跃</option>
            <option>在线+刚刚+今日活跃</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 右侧: 执行时间 + 回复风格 -->
    <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 flex flex-col">
      <h3 class="text-sm font-bold text-slate-800 mb-4 flex items-center gap-2">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        执行时间
      </h3>

      <!-- 日期选择 -->
      <div class="mb-4">
        <label class="block text-xs font-semibold text-slate-500 mb-2">执行日期</label>
        <div class="flex gap-2">
          <span class="w-9 h-9 rounded-full text-sm font-semibold flex items-center justify-center cursor-pointer bg-indigo-500 text-white shadow-md">一</span>
          <span class="w-9 h-9 rounded-full text-sm font-semibold flex items-center justify-center cursor-pointer bg-indigo-500 text-white shadow-md">二</span>
          <span class="w-9 h-9 rounded-full text-sm font-semibold flex items-center justify-center cursor-pointer bg-indigo-500 text-white shadow-md">三</span>
          <span class="w-9 h-9 rounded-full text-sm font-semibold flex items-center justify-center cursor-pointer bg-indigo-500 text-white shadow-md">四</span>
          <span class="w-9 h-9 rounded-full text-sm font-semibold flex items-center justify-center cursor-pointer bg-indigo-500 text-white shadow-md">五</span>
          <span class="w-9 h-9 rounded-full text-sm font-semibold flex items-center justify-center cursor-pointer bg-slate-100 text-slate-500 hover:bg-slate-200">六</span>
          <span class="w-9 h-9 rounded-full text-sm font-semibold flex items-center justify-center cursor-pointer bg-slate-100 text-slate-500 hover:bg-slate-200">日</span>
        </div>
      </div>

      <!-- 时段 -->
      <div class="mb-4">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-semibold text-slate-500">执行时段</span>
          <button class="text-xs text-indigo-500 hover:text-indigo-600 font-medium cursor-pointer flex items-center gap-1">
            <span class="text-base leading-none">+</span> 添加
          </button>
        </div>
        <div class="space-y-2">
          <div class="flex items-center gap-2">
            <span class="px-3 py-2 rounded-lg border border-slate-200 bg-slate-50 text-sm font-mono cursor-pointer hover:bg-slate-100">09:00</span>
            <span class="text-slate-400 text-sm">~</span>
            <span class="px-3 py-2 rounded-lg border border-slate-200 bg-slate-50 text-sm font-mono cursor-pointer hover:bg-slate-100">18:00</span>
            <button class="p-1.5 rounded-lg text-slate-400 hover:text-red-500 hover:bg-red-50 transition-colors cursor-pointer">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
            </button>
          </div>
        </div>
      </div>

      <hr class="border-slate-100 my-2" />

      <!-- 回复风格 -->
      <div class="mt-auto">
        <label class="block text-xs font-semibold text-slate-500 mb-2">AI 回复风格</label>
        <select class="w-full px-3 py-2.5 rounded-lg border border-slate-200 bg-slate-50 text-sm outline-none focus:border-indigo-500 cursor-pointer">
          <option>专业友好</option>
          <option>热情积极</option>
          <option>简洁直接</option>
        </select>
      </div>
    </div>
  </div>

  <!-- ═══ 执行记录 ═══ -->
  <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
    <div class="flex items-center justify-between mb-3">
      <h3 class="text-sm font-bold text-slate-800 flex items-center gap-2">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        执行记录
      </h3>
      <span class="text-xs text-slate-400">最近 5 条</span>
    </div>
    <div class="space-y-2">
      <div class="flex items-start gap-3 text-xs p-2.5 rounded-lg bg-slate-50">
        <span class="text-slate-400 font-mono whitespace-nowrap">14:25</span>
        <span class="text-slate-600">搜索「AI Agent」23 条，保存 5 条</span>
      </div>
      <div class="flex items-start gap-3 text-xs p-2.5 rounded-lg bg-slate-50">
        <span class="text-slate-400 font-mono whitespace-nowrap">14:25</span>
        <span class="text-slate-600">投递 3 条，成功 2 条</span>
      </div>
      <div class="flex items-start gap-3 text-xs p-2.5 rounded-lg bg-slate-50">
        <span class="text-slate-400 font-mono whitespace-nowrap">14:24</span>
        <span class="text-slate-600">AI 回复 1 条</span>
      </div>
      <div class="flex items-start gap-3 text-xs p-2.5 rounded-lg bg-slate-50">
        <span class="text-slate-400 font-mono whitespace-nowrap">14:22</span>
        <span class="text-slate-600">补充搜索 10 条，保存 3 条</span>
      </div>
      <div class="flex items-start gap-3 text-xs p-2.5 rounded-lg bg-slate-50">
        <span class="text-slate-400 font-mono whitespace-nowrap">14:22</span>
        <span class="text-slate-600">无更多待投岗位</span>
      </div>
    </div>
  </div>

</div>

</body>
</html>
